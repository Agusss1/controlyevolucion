# docker compose up --build   →   http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyo
      POSTGRES_PASSWORD: cyo
      POSTGRES_DB: cyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyo"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cyo:cyo@db:5432/cyo
      PORT: 3000
      # PUBLIC_URL: https://tu-dominio.example   # para los enlaces de invitación
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  pgdata:
